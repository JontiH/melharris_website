name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Skipped until scripts/setup.sh has set the account variable on the repo.
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version asset URLs
        run: scripts/stamp-assets.sh "${GITHUB_SHA::8}"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4.161.0 pages deploy --project-name=mom-website --branch=main --commit-dirty=true
